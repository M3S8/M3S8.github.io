<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
</head>
<body>
  <header>
    <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
    {{ partial "nav.html" . }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
